name: Programming language stats

on:
  push:
    paths:
      - .github/workflows/language-stats.yml
      - scripts/update-language-stats.py
  schedule:
    - cron: "33 2 * * *"
  workflow_dispatch:

concurrency:
  group: language-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate the language breakdown card
        run: python3 scripts/update-language-stats.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish the card when it changes
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: language-stats-output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
